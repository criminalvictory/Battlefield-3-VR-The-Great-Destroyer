; bf3vr settings. Changes take effect next time the mod is loaded.

[general]
; theater = flat floating screen, stereo = per-eye projection (alternate-eye rendering)
; F8 switches between them in game, F9 recenters (the mod's keys count with the game's window in front).
; dev_keys=1: the developer's keys too (F1, F5-F7, F10-F12, Delete, Page Up/Down, Pause, Ctrl+F2/F3/F4, Ctrl+Scroll Lock).
mode=theater

[theater]
screen_distance=2.5
screen_width=3.2

[stereo]
async_handover=0
; Must match the FOV slider in BF3's video options.
game_vertical_fov=75
render_fov=100
render_fov_last=100
detail_fov=100
pixels_per_tangent=906.2271
pose_lag=1

[camera]
; Pointer to the camera transform. The camera finder (F10) fills this in, or see CAMERA_GUIDE.md.
; base is the hex offset from bf3.exe; offsets are hex values separated by commas.

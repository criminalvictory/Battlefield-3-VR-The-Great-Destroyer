# The release zip, built on GitHub's own Windows servers straight from this repository's code: a clean 32-bit Release build and
# tools/package.ps1, with the settings the mod is played with in release/settings (the same ones every release zip has carried).
# Run it from the Actions tab: "Release build", "Run workflow", the version (for example 0.1.1-prealpha). The zip comes out as the
# run's artifact, to be checked and put on the Releases page.
name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, for example 0.1.1-prealpha (letters, digits, dots and dashes)"
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1 -Commit HEAD -Version $env:VERSION `
              -SettingsFrom "$env:GITHUB_WORKSPACE\release\settings" -Worktree "$env:RUNNER_TEMP\bf3vr-worktree" -Out "$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: BF3-VR-${{ inputs.version }}
          path: dist/BF3-VR-${{ inputs.version }}.zip
          if-no-files-found: error
